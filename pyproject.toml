[project]
name = "agents-md-bench"
version = "0.1.0"
description = "Benchmark coding agents under alternative AGENTS.md / CLAUDE.md files, on Harbor."
requires-python = ">=3.12"
dependencies = ["harbor==0.24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents_md_bench"]
